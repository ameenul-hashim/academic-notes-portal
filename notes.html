<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Academic Portal</title>
    <!-- Tailwind CSS CDN for consistency -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reuse existing glass‑card and theme system */
        .glass-card {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
        }
        html,body{min-height:100vh;margin:0;padding:0;}
        [data-theme] {color:#fff;}
    </style>
    <script>
        (function(){
            const savedTheme = localStorage.getItem('preferred-theme')||'rose';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body class="min-h-screen bg-transparent text-base font-sans antialiased flex flex-col" data-theme="rose">
    <header class="glass-card sticky top-0 z-50 py-4 shadow-lg">
        <div class="max-w-screen-2xl mx-auto px-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white">Notes</h1>
            <a href="index.html" class="text-sm text-orange-200 hover:underline">← Back to Home</a>
        </div>
    </header>
    <main class="flex-grow max-w-screen-2xl mx-auto px-4 py-8">
        <section class="glass-card rounded-3xl p-8">
            <h2 class="text-xl font-semibold text-white mb-4">Premium Notes Access</h2>
            <p class="text-gray-200 mb-6">Your notes are currently being prepared. Please check back later or contact the administrator for immediate access.</p>
            <div class="flex space-x-4">
                <button class="px-6 py-2 bg-gradient-to-r from-rose-500 to-pink-600 text-white rounded-full hover:scale-105 transition-transform">Refresh</button>
                <button class="px-6 py-2 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-full hover:scale-105 transition-transform">Contact Admin</button>
            </div>
        </section>
    </main>
    <footer class="text-center py-4 text-gray-400 text-sm">© 2026 Academic Notes Portal</footer>
</body>
</html>
